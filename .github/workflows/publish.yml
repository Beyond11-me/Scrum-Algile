name: Publish Images

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-pipeline
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Require production branch
        run: '[[ "$GITHUB_REF" == refs/heads/production ]] || { echo "Select the production branch."; exit 1; }'

  frontend:
    needs: validate
    uses: ./.github/workflows/frontend-ci.yml

  backend:
    needs: validate
    uses: ./.github/workflows/backend-ci.yml

  publish:
    name: Publish tested backend image
    needs: [frontend, backend]
    if: vars.ENABLE_AZURE_DEPLOYMENT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      image: ${{ steps.image.outputs.name }}
    env:
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      API_URL: ${{ needs.frontend.outputs.api_url }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate configuration and current production commit
        env:
          AZURE_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ACR_NAME AZURE_CLIENT AZURE_TENANT AZURE_SUBSCRIPTION; do
            [[ -n "${!name}" ]] || { echo "Missing deployment setting: $name"; exit 1; }
          done
          [[ "$API_URL" =~ ^https://[^/]+$ ]] || { echo 'VITE_API_URL must be the HTTPS API origin without a trailing slash.'; exit 1; }
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq '.object.sha')
          [[ "$GITHUB_SHA" == "$head" ]] || { echo 'Refusing to publish an outdated production run.'; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-image
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Push tested image to ACR
        id: image
        shell: bash
        run: |
          set -euo pipefail
          registry=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          az acr login --name "$ACR_NAME"
          image="$registry/isql-backend:${GITHUB_SHA}"
          docker load -i backend-image.tar
          docker tag isql-backend:local "$image"
          docker push "$image"
          echo "name=$image" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [frontend, backend, publish]
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.publish.outputs.image }}
      api_url: ${{ needs.frontend.outputs.api_url }}
    secrets: inherit
