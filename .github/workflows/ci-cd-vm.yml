name: CI/CD Pipeline - Azure VM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: isql-azure-vm-deployment
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # GIAI ĐOẠN 1: CHẠY TEST (Chạy trên GitHub Cloud runner)
  # -------------------------------------------------------------
  frontend-test:
    name: Test & Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend-test:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci-test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  # -------------------------------------------------------------
  # GIAI ĐOẠN 2: DEPLOY LÊN AZURE VM (Chạy trên Self-Hosted Runner)
  # Chỉ chạy khi:
  #  - Code được push/merge vào nhánh main
  #  - Tất cả các bài test ở trên đều PASS thành công
  # -------------------------------------------------------------
  deploy-to-vm:
    name: Deploy to Azure Student VM
    needs: [frontend-test, backend-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Deploy new version on Azure VM
        shell: bash
        run: |
          set -euo pipefail
          echo "=== 1. Di chuyển vào thư mục dự án ==="
          git config --global --add safe.directory /home/Scrum-Axon-Algile || true
          cd /home/Scrum-Axon-Algile

          echo "=== 2. Cập nhật mã nguồn mới nhất từ main ==="
          git fetch origin main
          git reset --hard origin/main

          echo "=== 3. Kiểm tra file cấu hình .env ==="
          if [ ! -f .env ]; then
            echo "LỖI: Không tìm thấy file .env tại /home/Scrum-Axon-Algile. Hãy đảm bảo file .env đã tồn tại trên VM."
            exit 1
          fi

          echo "=== 4. Rebuild và khởi động lại các container ==="
          # docker compose build & up: backend entrypoint sẽ tự động chạy migrations
          docker compose up -d --build

          echo "=== 5. Chờ hệ thống sẵn sàng và kiểm tra Healthcheck ==="
          sleep 10
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /dev/null; then
              echo "Backend API đã hoạt động bình thường!"
              break
            fi
            echo "Đang chờ Backend khởi động ($attempt/15)..."
            sleep 5
          done

          echo "=== 6. Dọn dẹp Docker Image cũ để tiết kiệm dung lượng ổ cứng ==="
          docker image prune -f

          echo "=== TRIỂN KHAI THÀNH CÔNG LÊN AZURE VM! ==="
