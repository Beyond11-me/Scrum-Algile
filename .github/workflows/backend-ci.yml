name: Backend CI

on:
  pull_request:
  push:
    branches-ignore: [production]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci-test.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  integration:
    name: Docker and SQL Server integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MSSQL_SA_PASSWORD: LocalCiSql123456
      SECRET_KEY: ci-only-secret-key-do-not-use-in-production
      IMAGE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint GitHub Actions workflows
        run: |
          for file in .github/workflows/*.yml; do
            docker run --rm -i rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 - < "$file"
          done
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start complete stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Verify frontend, API and SQL Server
        run: python3 scripts/ci/smoke_compose.py
      - name: Save tested backend image
        if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
        run: |
          running=$(docker inspect "$(docker compose ps -q backend)" --format '{{.Image}}')
          tagged=$(docker image inspect isql-backend:local --format '{{.Id}}')
          [[ "$running" == "$tagged" ]] || { echo 'Backend image tag does not match the tested container.'; exit 1; }
          docker save isql-backend:local -o backend-image.tar
      - name: Upload tested backend image
        if: github.ref == 'refs/heads/production' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-image
          path: backend-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans
